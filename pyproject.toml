[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqzc3d"
version = "0.0.1"
description = "Placeholder Python package for the sqzc3d C/C++ library (bindings upcoming)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "sqzc3d contributors" }]
keywords = ["c3d", "mocap", "biomechanics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
urls = { Homepage = "https://github.com/lshdlut/squeezc3d", Repository = "https://github.com/lshdlut/squeezc3d" }

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["sqzc3d"]

